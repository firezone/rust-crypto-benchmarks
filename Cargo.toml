[package]
name = "rust-crypto-benchmarks"
version = "0.0.0"
edition = "2024"
publish = false
description = "Builds, verifies and benchmarks the ChaCha20-Poly1305 implementations under impls/"

# Every implementation is its own Cargo project with its own lockfile, so that several versions of
# one crate can be compared. Keep them, and the harness they share, out of this workspace.
[workspace]
exclude = ["impls", "harness"]

[dependencies]
anstream = "1"
anstyle = "1"
clap = { version = "4.6", features = ["derive"] }
indicatif = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
