name: Benchmarks

on:
  push:
    branches: [main]
    # Results and the site have their own workflows; the results commit below must not
    # start another benchmark run either.
    paths-ignore: ["results/**", "site/**", "**.md"]
  workflow_dispatch:
  schedule:
    # Weekly, to pick up new compiler and runner image releases.
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            machine: github-ubuntu-24.04-x86_64
          - runner: ubuntu-24.04-arm
            machine: github-ubuntu-24.04-arm-aarch64
          - runner: windows-latest
            machine: github-windows-latest-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install
      - run: cargo run --locked -- --machine ${{ matrix.machine }} --out-dir target/ci-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-${{ matrix.machine }}
          path: target/ci-results/
          if-no-files-found: error

  commit:
    if: github.ref == 'refs/heads/main'
    needs: bench
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: commit-results
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: results-*
          path: results/
          merge-multiple: true
      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install
      - run: cargo run --locked -- validate
      - name: Commit results
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No new results"
            exit 0
          fi
          git commit -m "chore: add benchmark results from CI [skip ci]" -m "From $RUN_URL"
          for delay in 2 4 8 16; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep "$delay"
          done
          exit 1

  site:
    needs: commit
    if: ${{ !cancelled() && !failure() }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml
